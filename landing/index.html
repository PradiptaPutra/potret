<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Potret — Screenshots and screen recording for macOS</title>
    <meta
      name="description"
      content="A free, open-source macOS screenshot and screen-recording tool that lives in your menu bar. Capture an area, window or screen; annotate, pin or drag it out; record with click highlighting and trim on a real timeline. No account, no subscription, no telemetry."
    />
    <link rel="canonical" href="https://potret-landing.vercel.app/" />
    <meta name="theme-color" content="#fcfcfc" />

    <!-- Open Graph -->
    <meta property="og:title" content="Potret — Screenshots and screen recording for macOS" />
    <meta
      property="og:description"
      content="Capture, annotate, record and trim — free and open source, native Swift, 3.1 MB. No account, no subscription, no telemetry."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://potret-landing.vercel.app/" />
    <meta property="og:image" content="https://potret-landing.vercel.app/og-v041.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Potret — screenshots and screen recording for macOS. Free and open source." />
    <meta property="og:site_name" content="Potret" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Potret — screenshots and screen recording for macOS." />
    <meta name="twitter:title" content="Potret — Screenshots and screen recording for macOS" />
    <meta
      name="twitter:description"
      content="Capture, annotate, record and trim — free and open source, native Swift, 3.1 MB."
    />
    <meta name="twitter:image" content="https://potret-landing.vercel.app/og-v041.jpg" />

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Potret",
        "applicationCategory": "UtilitiesApplication",
        "applicationSubCategory": "DesignApplication",
        "operatingSystem": "macOS 14",
        "url": "https://potret-landing.vercel.app/",
        "description": "A free, open-source macOS screenshot and screen-recording tool that lives in your menu bar. Capture, annotate, pin, record with click highlighting, and trim on a timeline.",
        "softwareVersion": "0.4.1",
        "downloadUrl": "https://github.com/PradiptaPutra/potret/releases/latest",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- One geometric sans at three weights, plus a mono for the install command. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
